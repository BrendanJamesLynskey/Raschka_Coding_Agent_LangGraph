[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raschka-coding-agent-langgraph"
version = "0.2.0"
description = "A LangGraph implementation of the coding-agent architecture described in Sebastian Raschka's 'Components of a Coding Agent'."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brendan Lynskey" }]

dependencies = [
    "langgraph>=0.2.57",                 # <=0.2.56 rejects a node returning {}
    "langchain-core>=0.3.20",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.10",          # used for DeepSeek (OpenAI-compatible API)
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.5",            # 0.23.0-0.23.4 crash on collection with pytest 8
]
# Local open-weights models via an Ollama server (see docs/providers.md).
ollama = [
    "langchain-ollama>=0.3.4",           # first release with validate_model_on_init
]
# Tools from Model Context Protocol servers (see docs/mcp.md).
mcp = [
    "langchain-mcp-adapters>=0.2.0",
    # The adapters import APIs newer than their declared minimums; these
    # floors are the oldest combination verified to pass tests/test_mcp_tools.py.
    "langchain-core>=1.0.0",
    "mcp>=1.12.0",                       # also provides FastMCP for the test fixture
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
