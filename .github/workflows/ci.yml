name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # All extras, so the Ollama factory tests and the MCP tests run too.
      # Still fully offline: no Ollama server, no API keys — the MCP tests
      # use a Python FastMCP fixture server, so no Node either.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ollama,mcp]'

      - name: Offline test suite
        run: python -m pytest -v
